services:
  db: #Database container named postgres-pgvector
    image: pgvector/pgvector:pg17 #Prebuilt Postgres based on v17
    container_name: postgres-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234567
      POSTGRES_DB: postgres
    volumes: #Bind mount!!!!!
      - /mnt/rag_lvm/postgres_data:/var/lib/postgresql/data
    expose:
      - "5432" #Standard port for PostgreSQL but indempotent
    networks:
      - rag-network

  ingestion: #Ingestion container
    build: ./ingestion
    depends_on: #Database container must start up first
      - db
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
    
