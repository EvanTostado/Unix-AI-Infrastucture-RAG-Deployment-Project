events {
    worker_connections 1024;
}

http {
    # Rate limit: 5 requests/sec per IP, allowing a burst of 10 before returning HTTP 429
    limit_req_zone $binary_remote_addr zone=ai_rate_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream ollama_backend {
        least_conn;
        server ai-tier-ollama-1:11434 max_fails=2 fail_timeout=10s;
        server ai-tier-ollama-2:11434 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 11434;

        location / {
            limit_req zone=ai_rate_limit burst=10 nodelay;

            proxy_pass http://ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Required for LLM streaming (SSE/chunked) and CPU generation time
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;

            # Automatically failover to the other replica if one container dies mid-request
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
